; 빌드 프리셋. tools/build.ps1이 커밋마다 build/windows, build/web 으로 뽑는다.
; 안드로이드는 아직 없음: Android SDK·디버그 키스토어를 에디터 설정에 잡은 뒤
; 에디터 Project > Export 에서 Android 프리셋을 추가하고 build.ps1에 한 줄 더 넣으면 된다.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="tests/*, tools/*, docs/*, art/concept/*"
export_path="build/windows/DoodleMatch.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
application/modify_resources=false

[preset.1]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="tests/*, tools/*, docs/*, art/concept/*"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

variant/extensions_support=false
variant/thread_support=false
html/canvas_resize_policy=2
progressive_web_app/enabled=false
